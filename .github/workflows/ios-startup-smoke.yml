name: iOS Startup Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  launch:
    name: Launch release bundle
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NOVO_BUILD_ENV: development
      EXPO_PUBLIC_API_URL: https://novodev.tancheetiong.com/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Build release app for Simulator
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -type d -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/novo-simulator-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Launch app and capture startup diagnostics
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find "$RUNNER_TEMP/novo-simulator-derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          device="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if "iPad" in device["name"]))')"
          xcrun simctl boot "$device"
          open -a Simulator --args -CurrentDeviceUDID "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app_path"

          log_file="$RUNNER_TEMP/novo-startup.log"
          xcrun simctl spawn "$device" log stream \
            --style compact \
            --level debug \
            --predicate 'process == "novoDevelopment" OR composedMessage CONTAINS[c] "Unhandled JS Exception" OR composedMessage CONTAINS[c] "ReactNativeJS"' \
            >"$log_file" 2>&1 &
          log_pid=$!
          trap 'kill "$log_pid" 2>/dev/null || true; xcrun simctl shutdown "$device" 2>/dev/null || true' EXIT

          xcrun simctl launch "$device" com.novo.ecoloop
          sleep 12
          if ! xcrun simctl spawn "$device" launchctl print system | grep -q 'com.novo.ecoloop'; then
            cat "$log_file"
            echo 'novo exited during startup.' >&2
            exit 1
          fi
          if grep -Eqi 'Unhandled JS Exception|RCTFatal|Cannot find native module|Invariant Violation|TypeError:|ReferenceError:' "$log_file"; then
            cat "$log_file"
            echo 'novo emitted a fatal startup error.' >&2
            exit 1
          fi
          cat "$log_file"

      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-startup-log
          path: ${{ runner.temp }}/novo-startup.log
          if-no-files-found: warn

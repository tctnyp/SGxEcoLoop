name: CI

on:
  push:
    branches:
      - dev
      - zaviergpt
  pull_request:
    branches:
      - dev
      - zaviergpt

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Type-check mobile app
        run: npm run typecheck --workspace @novo/mobile
      - name: Type-check web app
        run: npm run typecheck --workspace @novo/web
      - name: Build web app
        run: npm run build --workspace @novo/web

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check backend
        run: npm run typecheck --workspace @novo/server
      - name: Test backend
        run: npm test --workspace @novo/server

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit deployed web and backend dependencies
        run: npm audit --omit=dev --audit-level=high --workspace @novo/web --workspace @novo/server
      - name: Report mobile build-tool advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical --workspace @novo/mobile
